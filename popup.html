<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeTube Downloader</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
    }

    .header {
      background: linear-gradient(135deg, #e94560 0%, #ff6b35 100%);
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .header .logo {
      width: 28px;
      height: 28px;
    }

    .content {
      padding: 20px;
    }

    .server-info {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .server-info label {
      font-size: 12px;
      color: #aaa;
      display: block;
      margin-bottom: 8px;
    }

    .server-info input {
      width: 100%;
      padding: 10px 12px;
      border: none;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 14px;
    }

    .server-info input:focus {
      outline: 2px solid #e94560;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 15px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #f44336;
    }

    .status-dot.online {
      background: #4caf50;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .status-text {
      font-size: 13px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #e94560 0%, #ff6b35 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .footer {
      text-align: center;
      padding: 15px;
      font-size: 11px;
      color: #666;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .footer a {
      color: #e94560;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>
      <svg class="logo" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
      </svg>
      MeTube Downloader
    </h1>
  </div>

  <div class="content">
    <div class="server-info">
      <label>Adres serwera MeTube</label>
      <input type="text" id="serverUrl" value="http://192.168.25.223:8081" placeholder="http://ip:port">
    </div>

    <div class="status">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-text" id="statusText">Sprawdzanie połączenia...</span>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="saveBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/>
        </svg>
        Zapisz ustawienia
      </button>
      <button class="btn btn-secondary" id="openMeitubeBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/>
        </svg>
        Otwórz MeTube
      </button>
    </div>
  </div>

  <div class="footer">
    Rozszerzenie dla <a href="https://github.com/alexta69/metube" target="_blank">MeTube</a>
    <br>
    <span style="color: #888;">Zgodne z wersją: 2026.02.04</span>
    <br>
    Stworzone z pasją do kodowania przez <strong>AleksanderOne</strong>
  </div>

  <script src="popup.js"></script>
</body>
</html>
